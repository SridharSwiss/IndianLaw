<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>52-Story Hyderabad Tower — Three.js Simulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #canvas-container { position: fixed; inset: 0; }

    /* ── HUD ── */
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 16px 20px; pointer-events: none; z-index: 10;
    }
    #title-block { pointer-events: none; }
    #title-block h1 {
      font-size: 18px; font-weight: 700; color: #fff;
      text-shadow: 0 0 20px rgba(255,160,50,.6);
      letter-spacing: 1px;
    }
    #title-block p { font-size: 11px; color: rgba(255,220,140,.75); margin-top: 2px; }

    #info-panel {
      background: rgba(8,8,20,.72); border: 1px solid rgba(255,160,50,.25);
      border-radius: 10px; padding: 12px 16px; min-width: 200px;
      backdrop-filter: blur(8px); pointer-events: none;
    }
    #info-panel h3 { font-size: 11px; color: rgba(255,160,50,.9); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .stat { display: flex; justify-content: space-between; gap: 24px; margin: 4px 0; }
    .stat span:first-child { font-size: 11px; color: rgba(255,255,255,.55); }
    .stat span:last-child  { font-size: 11px; color: #fff; font-weight: 600; }

    /* ── Controls Panel ── */
    #controls {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 10; pointer-events: all;
    }
    .btn {
      background: rgba(8,8,20,.82); border: 1px solid rgba(255,160,50,.35);
      color: rgba(255,220,140,.9); font-size: 11px; font-weight: 600;
      padding: 8px 14px; border-radius: 20px; cursor: pointer;
      transition: all .2s; letter-spacing: .5px; backdrop-filter: blur(8px);
    }
    .btn:hover, .btn.active {
      background: rgba(255,140,30,.18); border-color: rgba(255,160,50,.75);
      color: #fff; box-shadow: 0 0 12px rgba(255,140,30,.35);
    }

    /* ── Floor indicator ── */
    #floor-bar {
      position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      z-index: 10; pointer-events: none;
    }
    #floor-label { font-size: 10px; color: rgba(255,220,140,.7); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .floor-tick {
      width: 18px; height: 3px; border-radius: 2px;
      background: rgba(255,255,255,.12); transition: background .3s;
    }
    .floor-tick.active { background: rgba(255,160,50,.9); width: 24px; }
    #floor-number { font-size: 22px; font-weight: 700; color: rgba(255,160,50,.95); margin-top: 6px; }

    /* ── Loading ── */
    #loading {
      position: fixed; inset: 0; background: #08080f;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; transition: opacity .8s;
    }
    #loading h2 { font-size: 24px; color: rgba(255,160,50,.9); margin-bottom: 18px; letter-spacing: 3px; text-transform: uppercase; }
    #loading p  { font-size: 12px; color: rgba(255,255,255,.4); margin-top: 8px; }
    #progress-bar { width: 260px; height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
    #progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff8c1a, #ffd080); transition: width .4s; }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed; pointer-events: none; z-index: 20;
      background: rgba(8,8,20,.9); border: 1px solid rgba(255,160,50,.4);
      border-radius: 8px; padding: 8px 12px; font-size: 11px; color: #fff;
      display: none; backdrop-filter: blur(6px); max-width: 180px;
    }
    #tooltip strong { display: block; color: rgba(255,200,80,1); margin-bottom: 3px; }

    /* ── Day/Night slider ── */
    #time-control {
      position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px; z-index: 10;
    }
    #time-control label { font-size: 11px; color: rgba(255,220,140,.7); }
    #time-slider {
      -webkit-appearance: none; appearance: none;
      width: 180px; height: 3px; border-radius: 2px;
      background: linear-gradient(90deg, #1a1a3a, #ff8c1a, #ffd080, #87ceeb);
      outline: none; cursor: pointer;
    }
    #time-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: #fff; border: 2px solid #ff8c1a; cursor: pointer;
    }
  </style>
</head>
<body>

<div id="loading">
  <h2>Hyderabad Tower</h2>
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <p id="loading-text">Initialising scene…</p>
</div>

<div id="canvas-container"></div>

<!-- HUD -->
<div id="hud">
  <div id="title-block">
    <h1>HYDERABAD TOWER · 52F</h1>
    <p>Jubilee Hills, Hyderabad · 247 m · 2025</p>
  </div>
  <div id="info-panel">
    <h3>Building Stats</h3>
    <div class="stat"><span>Height</span><span>247 m</span></div>
    <div class="stat"><span>Floors</span><span>52</span></div>
    <div class="stat"><span>Floor Plate</span><span>2 400 m²</span></div>
    <div class="stat"><span>Facade</span><span>High-Perf Glass</span></div>
    <div class="stat"><span>Structural</span><span>RC Core + Steel</span></div>
    <div class="stat"><span>Use</span><span>Mixed-Use</span></div>
    <div class="stat" id="stat-time"><span>Time</span><span id="time-val">Day</span></div>
    <div class="stat"><span>FPS</span><span id="fps-val">—</span></div>
  </div>
</div>

<!-- Floor bar (right side) -->
<div id="floor-bar">
  <div id="floor-label">Floor</div>
  <div id="floor-ticks"></div>
  <div id="floor-number">—</div>
</div>

<!-- Time of day -->
<div id="time-control">
  <label>🌙</label>
  <input type="range" id="time-slider" min="0" max="100" value="65" />
  <label>☀️</label>
</div>

<!-- Controls -->
<div id="controls">
  <button class="btn" id="btn-orbit">Orbit</button>
  <button class="btn" id="btn-fly">Fly-Through</button>
  <button class="btn" id="btn-lobby">Lobby</button>
  <button class="btn" id="btn-roof">Rooftop</button>
  <button class="btn" id="btn-exterior">Exterior</button>
  <button class="btn" id="btn-xray">X-Ray</button>
  <button class="btn" id="btn-night">Auto-Night</button>
</div>

<div id="tooltip"><strong id="tt-title"></strong><span id="tt-body"></span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
